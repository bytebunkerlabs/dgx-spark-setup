# config/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nvidia_gpu     # GPU: temp, power, SM clock, util (nvidia-smi based)
    static_configs:
      - targets: ['nvidia-gpu-exporter:9835']

  - job_name: node           # host: CPU thermal zones, load, mem (/proc/meminfo), disk
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Uncomment to scrape LiteLLM's metrics endpoint if you enable it:
  # - job_name: litellm
  #   static_configs:
  #     - targets: ['host.docker.internal:4000']

  # spark-2 over the fabric (exporters bound to 192.168.100.2, ufw allows fabric ifaces)
  - job_name: spark-2-node
    static_configs:
      - targets: ['192.168.100.2:9100']
        labels: {node: spark-2}
  - job_name: spark-2-gpu
    static_configs:
      - targets: ['192.168.100.2:9835']
        labels: {node: spark-2}

  # vLLM on the head node (host network, port 8888). 5s interval because the
  # console uses rate() over a 20s window to tell "engine busy, output
  # buffered by the tool parser" from "actually stalled" — 15s scrapes would
  # leave that window with one sample.
  - job_name: vllm
    scrape_interval: 5s
    static_configs:
      - targets: ['172.19.0.1:8888']
        labels: {node: spark-1}
